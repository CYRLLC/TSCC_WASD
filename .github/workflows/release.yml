name: Draft preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches version
        shell: pwsh
        run: |
          [xml] $props = Get-Content -Raw Directory.Build.props
          $expected = 'v' + $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Expected tag $expected" }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create draft preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/*.zip, artifacts/*.sha256 | ForEach-Object FullName
          # Release notes: only this version's CHANGELOG section.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelog = Get-Content -Raw CHANGELOG.md
          $match = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b.*?(?=^## |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $match.Value.Trim() | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --draft --prerelease --title "YnyrWASD $env:GITHUB_REF_NAME preview" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
