name: Draft preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify tag matches version
        shell: pwsh
        run: |
          [xml] $props = Get-Content -Raw Directory.Build.props
          $expected = 'v' + $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Expected tag $expected" }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Create draft preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/*.zip, artifacts/*.sha256 | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --draft --prerelease --title "YnyrWASD $env:GITHUB_REF_NAME preview" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
